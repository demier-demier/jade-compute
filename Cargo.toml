[package]
name = "jade-compute"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Experimental Rust compute runtime with portable GEMM and a CoreX native bridge"
default-run = "jade-compute"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
half = "2.7"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32"
objc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

